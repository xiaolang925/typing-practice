<!DOCTYPE html>
<!--告诉浏览器：这是HTML5文档，这行固定放最顶上-->
<html lang="zh-CN">
<head>
    <!--head区：放"关于页面"的信息，不直接显示在页面上-->
    <meta charset="UTF-8">
    <!--页面编码用UTF-8，中文才不会乱码-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--适配手机/平板屏幕，固定写法-->
    <title>打字练习</title>
    <!--浏览器标签页上显示的名字-->
    <link rel="stylesheet" href="style.css">
    <!--把样式表styless.css引进来，页面才会变好看-->
</head>
<body>
    <!--body区：页面上真正显示的内容都写在这里-->
    <div class="container">
        <!--div是一个“容器”盒子，class是给他分组起名，方便CSS定位-->
        <h1>数字·符号 打字练习</h1>
        <!--hl是页面最大的一级标题-->
        <!--难度切换：三个按钮，selected保证默认为纯数字，当前选中的会高亮-->
        <div class="difficulty" id="difficulty">
            <button id="btn-digits" class="diff-btn selected">纯数字</button>
            <button id="btn-symbols" class="diff-btn">纯符号</button>
            <button id="btn-mixed" class="diff-btn">混合</button>
        </div>
        <!--打字区：JS会把每个字符包成一个span放进来，方便单独变色-->
        <div id="typing-area" class="typing-area" tabindex="0"></div>
        <!--id是给元素起“独一无二的名字”，JS靠document.getElementById找到他-->
        <p class="hint">点击下方文字区域，直接敲键盘开始打字</p>
        <!--p是段落文本-->
        <p class="status" id="status">第一步：先能打字，判错和计分下一步加</p>
        <!--这行文字以后会被JS动态改写，用来显示状态-->
        <button id="restart-btn">重新生成</button>
        <!--button是按钮，点击触发JS-->
    </div>
    <!--成绩界面：默认藏起来，打完一局后JS把它显示出来-->
    <div class="overlay" id="result-overlay">
        <!--成绩卡片：里面大字号显示各种成绩-->
        <div class="result-card">
            <!--难度：放在卡片最上面-->
            <h2 class="result-mode" id="result-mode">纯数字</h2>
            <!--六个成绩格子，每格=一个数值+一个标签-->
            <div class="result-grid">
                <div class="result-item">
                    <div class="result-value" id="result-time">0</div>
                    <div class="result-label">用时</div>
                </div>
                <div class="result-item">
                    <div class="result-value" id="result-cpm">0</div>
                    <div class="result-label">CPM</div>
                </div>
                <div class="result-item">
                    <div class="result-value" id="result-accuracy">0%</div>
                    <div class="result-label">准确率</div>
                </div>
                <div class="result-item">
                    <div class="result-value" id="result-total">0</div>
                    <div class="result-label">总键数</div>
                </div>
                <div class="result-item">
                    <div class="result-value" id="result-correct">0</div>
                    <div class="result-label">对键数</div>
                </div>
                <div class="result-item">
                    <div class="result-value" id="result-wrong">0</div>
                    <div class="result-label">打错次数</div>
                </div>
            </div>
            <!--再来一局：点它关掉成绩界面并开始新题-->
            <button id="again-btn">再来一局</button>
        </div>
    </div>
    <script src="script.js"></script>
    <!--把JS脚本引进来，打字逻辑都在里面-->
</body>
</html>
